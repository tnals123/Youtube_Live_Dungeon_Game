<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>던전 레이드 - 솔로 데모</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @font-face {
            font-family: 'DungGeunMo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'SeoulNamsan';
            src: url('assets/fonts/SeoulNamsanB.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }
        @font-face {
            font-family: 'SeoulNamsanEB';
            src: url('assets/fonts/SeoulNamsanEB.ttf') format('truetype');
            font-weight: 800;
            font-style: normal;
        }

        .font-preload { position: absolute; left: -9999px; visibility: hidden; }

        html, body {
            background: #0a0a0a;
            min-height: 100%;
        }

        body {
            font-family: 'SeoulNamsan', 'DungGeunMo', monospace;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px 28px;
            gap: 12px;
        }

        header {
            text-align: center;
            max-width: 480px;
        }

        header h1 {
            font-family: 'DungGeunMo', monospace;
            font-size: 20px;
            color: #FFD700;
            text-shadow: 0 0 8px rgba(255,215,0,0.35);
            margin-bottom: 6px;
        }

        header p {
            font-size: 12px;
            color: #999;
            line-height: 1.6;
        }

        header a { color: #6EC1FF; text-decoration: none; }
        header a:hover { text-decoration: underline; }

        #stage-wrap {
            width: min(94vw, 440px);
            aspect-ratio: 1080 / 1920;
            background: #000;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.7), inset 0 0 2px rgba(255,255,255,0.08);
            border: 3px solid #2a2a2a;
        }

        #game-container { width: 100%; height: 100%; }

        #demo-controls {
            width: min(94vw, 440px);
            min-height: 74px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(20, 16, 10, 0.9);
            border: 2px solid #8B7355;
            border-radius: 12px;
            padding: 12px;
        }

        #demo-controls.visible { display: flex; }

        .demo-hint {
            font-size: 13px;
            color: #FFE9C9;
            text-align: center;
        }

        .demo-btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .demo-btn {
            font-family: 'SeoulNamsanEB', 'SeoulNamsan', monospace;
            font-size: 15px;
            padding: 12px 20px;
            border-radius: 10px;
            border: 2px solid #FFD700;
            background: linear-gradient(180deg, #3a2f1a, #1c1608);
            color: #FFD700;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s;
        }

        .demo-btn:hover:not(:disabled) {
            background: linear-gradient(180deg, #4a3d24, #2a2210);
            transform: translateY(-1px);
        }

        .demo-btn:active:not(:disabled) { transform: translateY(1px); }

        .demo-btn:disabled { opacity: 0.35; cursor: default; }

        footer {
            font-size: 11px;
            color: #666;
            text-align: center;
            max-width: 440px;
        }
        footer a { color: #6EC1FF; text-decoration: none; }

        /* ===== 레이아웃: 게임 열 + 채팅 열 (좁은 화면에선 세로로 쌓임) ===== */
        .layout {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            align-items: flex-start;
        }

        .game-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* ===== 가짜 유튜브 라이브 채팅 ===== */
        #chat-panel {
            width: min(300px, 94vw);
            height: min(72vh, 660px);
            background: #0f0f0f;
            border: 2px solid #303030;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-header {
            padding: 10px 12px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 13px;
            font-weight: bold;
            color: #eee;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        #chat-header .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #FF3B3B;
            box-shadow: 0 0 6px #FF3B3B;
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .chat-msg {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 12.5px;
            line-height: 1.4;
            word-break: break-word;
        }

        .chat-avatar {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            color: #111;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-name { font-weight: bold; flex-shrink: 0; }
        .chat-text { color: #ddd; }

        .chat-you {
            background: rgba(255, 215, 0, 0.08);
            border-radius: 6px;
            padding: 2px 4px;
            margin: -2px -4px;
        }
        .chat-you .chat-text { color: #FFE9C9; }

        .chat-system {
            text-align: center;
            font-size: 11.5px;
            color: #999;
            font-style: italic;
            padding: 2px 0;
        }
    </style>
</head>
<body>
    <div class="font-preload" style="font-family: 'DungGeunMo';">.</div>
    <div class="font-preload" style="font-family: 'SeoulNamsan';">.</div>
    <div class="font-preload" style="font-family: 'SeoulNamsanEB';">.</div>

    <header>
        <h1>🏰 던전 레이드 - 솔로 데모</h1>
        <p>
            서버 없이 브라우저에서 바로 진행되는 1인용 체험판입니다.<br>
            실제 라이브 버전은 유튜브 실시간 채팅으로 시청자 수십~수백 명이<br>
            함께 파티를 이뤄 던전을 공략합니다.
        </p>
    </header>

    <div class="layout">
        <div class="game-col">
            <div id="stage-wrap">
                <div id="game-container"></div>
            </div>
            <div id="demo-controls"></div>
        </div>

        <div id="chat-panel">
            <div id="chat-header"><span class="dot"></span> 실시간 채팅 (재현)</div>
            <div id="chat-messages"></div>
        </div>
    </div>

    <footer>
        전체 소스 코드 · 실시간(라이브) 버전 안내는
        <a href="https://github.com/tnals123/Youtube_Live_Dungeon_Game" target="_blank" rel="noopener">GitHub 저장소</a>에서 확인할 수 있습니다.
    </footer>

    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

    <!-- Game Code -->
    <script src="js/i18n.js"></script>
    <script src="js/monsterAnim.js"></script>
    <script src="js/bgmManager.js"></script>
    <script src="js/vfxManager.js"></script>
    <script src="js/formation.js"></script>
    <script src="js/joinCard.js"></script>
    <script src="js/localGameMaster.js"></script>
    <script src="js/scenes/LobbyScene.js"></script>
    <script src="js/scenes/DungeonEntryScene.js"></script>
    <script src="js/scenes/ExploreScene.js"></script>
    <script src="js/scenes/BattleScene.js"></script>
    <script src="js/game.js"></script>
    <script src="js/demoUI.js"></script>
    <script src="js/chatLog.js"></script>

    <script>
        // Phaser 게임 인스턴스(game.js가 만듦)가 준비되는 대로 데모 각본을 시작한다
        (function waitAndStart() {
            const check = setInterval(() => {
                if (window.game && window.gameSocket) {
                    clearInterval(check);
                    setTimeout(() => window.gameSocket.start(), 900);
                }
            }, 100);
        })();
    </script>
</body>
</html>
